# logrotate-rbp.conf -- a ceiling on this unit's own logs.
#
# Installed by install.sh to /etc/logrotate.d/rbp.
#
# WHY. rbp's log reached 492 MB in two days, and nothing rotated it. It grows because rbp prints one
# line per FRAME (`DS_HW_Glib3_DFB.c <1106>`, a DirectFB debug print, at its own frame rate -- about
# 5.3 million lines in two days), and the first thing that broke was not the disk: the config page
# counts those lines to answer "is rbp painting?", by reading the whole file on every poll, and at
# 492 MB that went from instant to never. The page no longer reads the whole file (it counts only
# what has been appended since it last looked, which is all a RATE needs), so this file is now about
# the disk and about the next reader rather than about that page.
#
# NOTHING HERE MAY SILENCE THE LOG, and that is the one thing to keep in mind when editing it. The
# DS_HW line IS this unit's frame counter -- the page's "is rbp painting?", and the measurement the
# whole blank-cold-boot diagnosis was taken from. A cap is what this is; a change that stopped rbp
# printing that line would take the instrument away.
#
# WHY copytruncate IS NOT OPTIONAL. Every file below is written by a process that ALREADY HOLDS IT
# OPEN: rbp's own stdout is redirected into rbp.log by start-rb.sh, and the shims append from their
# own threads. logrotate's default action is rename-then-create, which would leave each of them
# writing into the ROTATED file for the rest of its life -- the same failure this whole exercise is
# about, and the reason a plain `mv` of rbp.log does not work either. copytruncate copies and then
# truncates IN PLACE, so the writers' file descriptors follow the truncation. The cost is a window
# (microseconds here) in which lines written between the copy and the truncate are lost, which for
# a debug log is the right trade.
#
# ...and delaycompress goes with it: compressing the CURRENT file in place would rewrite a file the
# writers still have open. With delaycompress the newest generation is left uncompressed until the
# next rotation, by which time nothing is writing to it.
#
# ...and the /tmp block needs `su` BECAUSE /tmp IS WORLD-WRITABLE. logrotate refuses to rotate a
# file whose parent directory is writable by anyone but root -- "logrotate: skipping ... because
# parent directory has insecure permissions ... Set "su" directive in config file" -- and it is
# right to: with a directory anybody can write, the file being rotated may not be the file
# logrotate just looked at. `su root root` says "do this as root", which is what it was doing
# anyway, and it is what makes these entries run at all. Measured 2026-10-12: without it the
# /opt block rotated and every /tmp entry was silently skipped, which is the half that matters
# most here -- audioshim.log was 54 MB of a 1.9 GB tmpfs.
#
# THE /tmp ENTRIES ARE TMPFS, so they do not free disk -- they bound RAM, which is the scarcer
# resource here: audioshim.log was 54 MB of a 1.9 GB tmpfs when this was written, and RB_VERBOSE
# (rb.conf) is what makes it grow.
#
# size, NOT A SHORTER INTERVAL. This unit's logrotate runs from the stock daily timer, so `size` is
# checked once a day: a file is rotated when it exceeds the size AT THAT MOMENT, which is why the
# realistic ceiling is a day's growth (~200-250 MB) rather than the number below. Lowering it below
# that changes nothing by itself; a more frequent timer would.

/opt/rbp/log/*.log {
    daily
    size 20M
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/tmp/*.log {
    su root root
    daily
    size 20M
    rotate 2
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
